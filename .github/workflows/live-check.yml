name: Live check

# The release, checked from outside after it has gone live: the same
# browser walk as the e2e gate, pointed at https://christinaschwarz.art.
#
# deploy-production.yml already smoke-tests with curl from the in-cluster
# runner (the version, the page, the www redirect), and that is what the
# release notes quote. This adds what curl cannot see: the page in real
# browsers on a phone and a desktop, every picture loading, the sections and
# links followed, the enlarged view paged through, accessibility, and
# Lighthouse. A browser cannot run on the in-cluster runner (512Mi), so it
# runs here, on GitHub's runners, right after each successful deploy, and
# once a day so a site that breaks between releases is noticed too.
#
# Read-only: only tests tagged @live run here.
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  schedule:
    - cron: '17 11 * * *'   # 05:17 Chicago (CST), outside the busy hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    # After a deploy only if it succeeded; a failed deploy cut no release.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://christinaschwarz.art
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The newest release is what must be live: after a deploy it is the one
      # that deploy cut. The deploy finished already, so no waiting is needed.
      - name: Which release should be live
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "expecting ${tag}"

      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit

      - name: Walk the live site (desktop, Android, iPhone)
        env:
          EXPECT_VERSION: ${{ steps.rel.outputs.version }}
        run: npx playwright test --grep @live --project=desktop-chromium --project=phone-chromium --project=phone-webkit

      - name: Lighthouse (Google PageSpeed) on the live site
        run: scripts/lighthouse-gate.sh https://christinaschwarz.art/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report.report.html
          retention-days: 30
