name: PR checks

# PRs to both branches: Dependabot's PRs land on main, and build-push.yml only
# runs after a merge, so without main here dependency bumps would be first
# tested on the way to production.
on:
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # In the `test` job on purpose: `test` is a required check on
      # production, so a vulnerable dependency blocks the merge. As its own
      # job it would be advisory.
      - run: npm audit --audit-level=high

      # The image is otherwise first built by the deploy, after the merge.
      # Build it here, then prove it is non-root on its own: run it with NO
      # --user (the cluster's runAsUser would mask a root image) and ask it.
      - name: Build the image and check it runs as uid 1000
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=pr-check -t christina-art:pr .
          uid=$(docker run --rm --entrypoint id christina-art:pr -u)
          gid=$(docker run --rm --entrypoint id christina-art:pr -g)
          echo "image runs as ${uid}:${gid}"
          [ "$uid:$gid" = "1000:1000" ] || { echo "::error::image runs as ${uid}:${gid}, expected 1000:1000"; exit 1; }
          docker run -d --name pr -p 8080:8080 christina-art:pr
          for _ in $(seq 1 20); do
            if curl -fs http://localhost:8080/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json; echo
          grep -q '"version":"pr-check"' /tmp/health.json \
            || { echo "::error::container did not report the stamped version"; docker logs pr; exit 1; }
          docker rm -f pr

      # Only on the way to production: that merge cuts a release, and notes
      # left under [Unreleased] would be published a second time.
      - name: Refuse notes that have already been published
        if: github.base_ref == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-changelog.sh

      # The release step runs only after a deploy, so a broken notes script
      # would otherwise first show itself with the site already updated.
      # Render the notes here with stand-in smoke-test values.
      - name: Render the release notes the deploy would publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2099.01.01.1
          SMOKE_SERVED: 2099.01.01.1
          SMOKE_PAGE: '200'
          SMOKE_WWW_CODE: '301'
          SMOKE_WWW_LOCATION: https://christinaschwarz.art/release-check?v=2099.01.01.1
          SMOKE_AT: 2099-01-01T00:00:00Z
        run: |
          set -euo pipefail
          git fetch --quiet --tags --unshallow origin 2>/dev/null || git fetch --quiet --tags origin
          scripts/release-notes.sh | tee /tmp/notes.md
          grep -q '### Verified at release' /tmp/notes.md

      # The deploy workflow itself is only exercised by a deploy; lint it (and
      # the others) here so a typo cannot reach production.
      - name: Lint the workflows
        run: |
          set -euo pipefail
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color

  e2e:
    # The release gate, in a browser. On GitHub's runners, not in the deploy:
    # installing a browser on the in-cluster runner (512Mi) OOM-kills it.
    #
    # It tests the Docker image this commit builds, the same artifact the
    # deploy ships (content compiled in, no content/ beside it), in four
    # browsers: desktop Chrome, an Android phone, an iPhone (WebKit, i.e.
    # Safari) and desktop Firefox. Then Lighthouse, Google's PageSpeed test.
    # One job, so the required check stays the single `e2e` context.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Build and start the image
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t christina-art:e2e .
          docker run -d --name site -p 8080:8080 christina-art:e2e
          for _ in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 1; done
          echo

      # `--with-deps` runs `apt-get update`, which also reads the Google
      # Chrome source the runner image ships. One bad index there fails the
      # whole job (it did, 2026-09-09, in art), so drop the source we don't
      # use. The Chrome binary itself stays; Lighthouse uses it below.
      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      - name: Walk the site in four browsers
        env:
          BASE_URL: http://localhost:8080
          EXPECT_VERSION: 2099.01.01.1
        run: npx playwright test

      - name: Lighthouse (Google PageSpeed) on a phone
        run: scripts/lighthouse-gate.sh http://localhost:8080/

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report.report.html
          retention-days: 14

      - name: Server log when something failed
        if: failure()
        run: docker logs site

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      # analyze does not fail on findings by itself; this is the gate.
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          total=0
          for f in sarif-results/*.sarif; do
            count=$(jq '[.runs[].results[]] | length' "$f")
            total=$((total + count))
            jq -r '.runs[] as $run | $run.results[]
              | . as $r
              | ($run.tool.driver.rules[$r.rule.index // 0].id // $r.ruleId) as $rule
              | ($r.locations[0].physicalLocation) as $loc
              | "\($loc.artifactLocation.uri):\($loc.region.startLine // 0)  [\($rule)]  \($r.message.text)"' "$f" || true
          done
          echo "CodeQL findings: $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL found $total finding(s) — blocking merge"
            exit 1
          fi
