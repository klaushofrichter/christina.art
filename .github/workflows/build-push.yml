name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # `:main` and nothing else. deploy-production.yml is the only writer
          # of `:<sha>` (the tag kube-setup's manifest pins), `:v<version>` and
          # `:latest`. A main build writing the same sha would replace the
          # released image under the pin with an unversioned one, and the next
          # pod restart would quietly run it.
          tags: |
            ghcr.io/klaushofrichter/christina.art:main
